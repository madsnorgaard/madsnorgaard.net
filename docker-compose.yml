networks:
  web:
    external: true
  # Drupal internal network — lets Nuxt reach madsnorgaard_drupal without going via public internet
  drupalmadsnorgaardnet_internal:
    external: true

services:
  madsnorgaard_nuxt:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: madsnorgaard-nuxt:latest
    restart: always
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DRUPAL_BASE_URL: http://madsnorgaard_drupal:80
      PHOTO_SITE_URL: https://photo.madsnorgaard.net
    container_name: ${WORDPRESS_DOMAIN}_nuxt
    labels:
      - traefik.http.routers.madsnorgaard_nuxt.rule=Host(`${WORDPRESS_DOMAIN}`) || Host(`www.${WORDPRESS_DOMAIN}`)
      - traefik.http.routers.madsnorgaard_nuxt.tls=true
      - traefik.http.routers.madsnorgaard_nuxt.tls.certresolver=lets-encrypt
      - traefik.http.services.madsnorgaard_nuxt.loadbalancer.server.port=3000
    networks:
      - web
      - drupalmadsnorgaardnet_internal

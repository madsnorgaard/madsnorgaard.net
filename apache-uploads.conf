# Serve /wp-content/uploads/ as static files only.
# AllowOverride None prevents Apache from reading .htaccess files in this tree
# (avoids "unable to read htaccess" 403 when permissions differ from www-data).
# PHP execution is still blocked at the Directory level.
<Directory /var/www/html/wp-content/uploads>
    AllowOverride None
    Require all granted
    <FilesMatch "\.(php|phtml|php3|php4|php5|pl|py|jsp|asp|shtml|sh|cgi)$">
        Require all denied
    </FilesMatch>
</Directory>
